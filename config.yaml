project:
  name: "DC Council Weekly Digest"
  timezone: "America/New_York"

storage:
  db_path: "db.sqlite"

feeds:
  - name: "Granicus video hearings"
    source: "granicus_rss"
    url: "https://dc.granicus.com/ViewPublisherRSS.php?mode=vpodcast&view_id=2"

  - name: "Granicus captions"
    source: "granicus_captions"
    url: "https://dc.granicus.com/viewpublisher.php?view_id=2"

  - name: "DC Register recent rulemakings"
    source: "dcregs"
    url: "https://www.dcregs.dc.gov/default.aspx"

  - name: "Performance oversight documents"
    source: "performance_oversight"
    url: "https://dccouncil.gov/performance-oversight-{year}/"

  - name: "YouTube channel videos"
    source: "youtube"
    url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCsRAGNZrk_9pfss7oyHs9GA"

  - name: "Major news mentions (Google Alerts)"
    source: "google_alerts"
    url: "https://www.google.com/alerts/feeds/00411844104616880365/12946569030537193381"

  - name: "DC Bureau (States Newsroom)"
    source: "dc_bureau"
    url: "https://www.newsfromthestates.com/api/v2/article/category?article_category=565"

  - name: "Washington Post Politics"
    source: "washington_post"
    url: "https://www.washingtonpost.com/arcio/rss/category/politics/?itid=lk_inline_manual_2"

  - name: "Washington Post Local"
    source: "washington_post"
    url: "https://feeds.washingtonpost.com/rss/local?itid=lk_inline_manual_9"

  - name: "Washington Times Headlines"
    source: "washington_times"
    url: "https://www.washingtontimes.com/rss/headlines/news/"

  - name: "51st News (Latest)"
    source: "fifty_first"
    url: "https://51st.news/latest/rss"

  - name: "Popville"
    source: "popville"
    url: "http://www.popville.com/feed/"

  - name: "Greater Greater Washington"
    source: "ggwash"
    url: "https://ggwash.org/rss"

youtube_api:
  channel_id: "UCsRAGNZrk_9pfss7oyHs9GA"
  event_types: ["live", "upcoming"]
  max_results_per_event_type: 25

ranking:
  source_weight:
    granicus_rss: 3
    granicus_captions: 2
    youtube: 2
    youtube_live: 2
    youtube_upcoming: 2
    dcregs_proposed: 2
    dcregs_emergency: 2
    performance_oversight: 3
    # An aggregator of third-party coverage, not a publisher, and the feed the
    # syndication duplicates arrive through. It must not tie with the Council's
    # own record: at 3 it outranked every Granicus hearing in the corpus.
    google_alerts: 1
    dc_bureau: 1
    washington_post: 1
    washington_times: 1
    fifty_first: 1
    popville: 1
    ggwash: 1

  # Used only to choose which copies of one story a summary card cites. A
  # widely syndicated story arrives ~20 times, and `source` cannot separate
  # them because they all come in through the google_alerts feed, so this is
  # keyed on the publisher's domain. Unlisted domains take default_weight.
  citation_domain_weight:
    default_weight: 3

    # Official publications outrank every third-party outlet, and by a margin
    # no media tier can reach. When the Council has published the record
    # itself, that is the citation; press coverage of it is secondary.
    domain_suffixes:
      dc.gov: 10            # dccouncil.gov sits under this, as do agency sites
      dccouncil.gov: 10
      dc.granicus.com: 10   # hearing video and captions
      dcregs.dc.gov: 10

    domains:
      # DC-native reporting
      washingtonpost.com: 6
      wamu.org: 6
      washingtoncitypaper.com: 6
      ggwash.org: 6
      51st.news: 6
      washingtoninformer.com: 5
      dc.citycast.fm: 5
      washingtonian.com: 5
      popville.com: 5
      afro.com: 5
      notus.org: 5
      wtop.com: 5
      washingtontimes.com: 5
      # Local broadcast
      wusa9.com: 4
      nbcwashington.com: 4
      wjla.com: 4
      fox5dc.com: 4
      # National outlets covering DC
      thehill.com: 4
      washingtonexaminer.com: 4
      foxnews.com: 4
      dailywire.com: 3
      justthenews.com: 3
      # Aggregators, mirrors and syndication endpoints: real articles, but
      # never the copy to cite when the original is also in the corpus.
      news.yahoo.com: 1
      ca.news.yahoo.com: 1
      au.news.yahoo.com: 1
      yahoo.com: 1
      aol.com: 1
      ground.news: 1
      msn.com: 1
      ntd.com: 1
      wfin.com: 1
      streamlinefeed.co.ke: 1
      san.com: 1
      sfg.media: 1
      supertalk929.com: 1
      the-sun.com: 1
      buttondown.com: 2
      youtube.com: 2

